# ─────────────────────────────────────────────────────────────
# Runtime knobs.
#
# Every threshold lives here rather than inline in code or
# prompts, so tuning against the golden set is a config change.
# ─────────────────────────────────────────────────────────────

agent:
  # Hard ceiling on loop iterations. The agent usually stops
  # earlier because Reflect says it has enough; this only exists
  # so a pathological question cannot spin.
  max_iterations: 3

  # Stop immediately if a lap added no new evidence. Without this
  # the agent can burn its remaining laps re-asking a question
  # that returns nothing.
  stop_if_no_new_evidence: true

  # Router complexity_hint values that skip Reflect on lap 1.
  # A pure lookup has nothing to reflect about — the answer is
  # either in the row or it isn't.
  skip_reflect_on: ["lookup"]

  # Cap on evidence entries carried in context. Entries are
  # summaries, not raw rows, so this is generous in practice.
  max_evidence_entries: 20

  # Plan may request several tools per lap; they run in parallel.
  # Beyond a handful it is fishing, not planning.
  max_tool_calls_per_lap: 4

  # Result rows shown in an evidence summary. The rest stay in
  # evidence_raw, reachable by raw_ref, never paid for in tokens.
  summary_max_rows: 8

  # Used when a comparison row carries no tolerance of its own.
  default_tolerance_pct: 10.0

api:
  # Ceiling on one turn, loop + answer. A runaway turn otherwise holds a
  # connection indefinitely. On the ceiling the turn stops and answers
  # from the evidence gathered so far, marked partial.
  turn_timeout_seconds: 45

llm:
  # Which tier each node runs on. Router and Reflect are
  # classification under a fixed schema — they do not need the
  # strong model, and on a free tier the cheap model has a far
  # larger daily budget.
  tiers:
    router: cheap
    plan: strong
    reflect: cheap
    synthesize: strong
    judge: strong        # evaluation only, never the live path
    groundedness: strong # tier 4 only, fires on a flagged claim

  temperature:
    router: 0.0
    plan: 0.0
    reflect: 0.0
    synthesize: 0.2      # a little warmth in prose, nothing more
    judge: 0.0           # determinism matters more than style here
    groundedness: 0.0

  # Reasoning models spend part of this on thinking before the reply,
  # so it is sized for thinking + answer, not the answer alone. A reply
  # cut off by the limit fails JSON validation.
  max_tokens:
    router: 2048
    plan: 4096
    reflect: 2048
    synthesize: 4096
    judge: 2048
    groundedness: 2048

  # How long reasoning models think. "low" is plenty for classification
  # and keeps latency and the free-tier token budget down.
  reasoning_effort:
    router: low
    plan: low
    reflect: low
    synthesize: low
    judge: low
    groundedness: low

  # A reply that fails schema validation gets this many retries, each
  # shown the validation error. Then the node fails, loudly.
  json_repair_attempts: 1

retrieval:
  # Hybrid search pulls this many candidates before reranking.
  # Candidate retrieval is cheap; reranking is what scales with
  # list length, so pull wide and rerank narrow.
  candidate_k: 50
  final_k: 5

  # Weighting between the vector and keyword halves of hybrid
  # search, fused with reciprocal rank fusion.
  rrf_k: 60
  vector_weight: 0.6
  keyword_weight: 0.4

  # Below this rerank score, a chunk is not treated as usable
  # evidence. Returning weak context is worse than returning
  # none, because weak context is what the model builds
  # confident nonsense on.
  confidence_threshold: 0.55

  # Skip reranking when the top hybrid hit leads the runner-up by
  # this margin. Common on precise entity queries.
  rerank_skip_margin: 0.25

  # Entity id is a ranking boost, not a hard filter. Most service
  # documentation is model-specific, not VIN-specific, so a strict
  # VIN filter would discard exactly the documents we want.
  entity_boost: 0.15

  # Cross-encoder cost scales with sequence length, so candidates are
  # truncated before scoring. 512 tokens is the model's limit.
  rerank_max_length: 512
  # Small batches, scored shortest-first: padding to the longest pair
  # in a batch is what makes large CPU batches slow.
  rerank_batch_size: 8

entity_resolution:
  # Below exact match, how close a fuzzy match must be before we
  # accept it and say so in the answer.
  auto_accept_score: 92
  # Between these, we ask the user which one they meant.
  disambiguate_score: 78
  max_suggestions: 3
  # pg_trgm prefilter before rapidfuzz scores in Python. Loose on
  # purpose: it only has to keep the right answer in the candidate
  # set; rapidfuzz makes the actual decision.
  trigram_prefilter: 0.2
  max_candidates: 50

chunking:
  prose_chunk_size: 800
  prose_overlap: 120
  # Tables are never split regardless of size. A shredded table
  # answers nothing.
  table_split: false
  # Lookup tables also emit one chunk per row so exact codes land
  # on a small precise chunk.
  emit_row_chunks_for_lookup_tables: true
  prepend_context_header: true
  # A paragraph directly above a table is its caption only if it is
  # short; a long one is prose that happens to precede the table.
  max_caption_chars: 300
  # What an error code looks like in text. Tagged on every chunk so
  # retrieval and promotion agree on the same definition.
  error_code_pattern: '\b[A-Z]{2,5}_\d{2,4}\b'
  # A table is a lookup table when every first-column value looks
  # like a key (ERR_401, SB-114, SC-F50) and none repeat.
  lookup_key_pattern: '^[A-Z][A-Z0-9]*(?:[-_][A-Z0-9]+)+$'

embeddings:
  # Chunks per model call. Bounded so a large folder cannot exhaust
  # memory in one pass.
  batch_size: 32
  # Query embeddings repeat across laps of the same turn; cache them.
  query_cache_size: 256

mcp:
  # Every tool call has a deadline; a hung tool must not hang the turn.
  # Generous, because a cold server may still be loading its models.
  # A slow query is stopped earlier, by statement_timeout.
  call_timeout_seconds: 45
  # Transport errors only. A timeout is never retried as-is: the same
  # query would time out again.
  transport_retries: 2
  retry_backoff_seconds: 0.5

db:
  owner_pool_size: 5
  owner_max_overflow: 5
  # Small on purpose: the agent must never be able to exhaust
  # connections the rest of the system needs.
  readonly_pool_size: 3
  readonly_max_overflow: 0
  # The SQL tool runs model-written SQL as this narrower role
  # (migration 005): it cannot read document_chunks.embedding even
  # if the validator missed it. Retrieval keeps the wider role.
  sql_tool_role: copilot_sql

sql_validation:
  max_joins: 3
  max_subquery_depth: 2
  default_limit: 100
  max_limit: 1000

  # Planner cost ceiling, checked via EXPLAIN before execution.
  # This is the check that actually protects the database — AST
  # rules cannot reason about how expensive a valid query is.
  #
  # Measured, not guessed: scripts/calibrate_cost_budget.py asks the
  # planner on the loaded data (2M telemetry rows). Heaviest legitimate
  # query ~29k, cheapest full telemetry scan ~46k. The old 500000 let
  # every full scan through. Re-run the script when volume changes by
  # an order of magnitude — cost grows with table size.
  explain_cost_budget: 40000
  explain_max_rows: 1000000

  statement_timeout_ms: 5000

  # Tables that must carry a time predicate. These are the big
  # ones; an unbounded scan here is the realistic way to hurt a
  # production database with a perfectly valid SELECT.
  require_time_filter_on:
    - vehicle_telemetry

  # Written as Postgres spells them. Anything not listed is refused,
  # including built-ins sqlglot recognises: generate_series and repeat
  # are harmless-looking ways to make a tiny query enormous, and
  # row_to_json / string_agg re-package whole rows past column checks.
  allowed_functions:
    # aggregates
    - avg
    - sum
    - count
    - min
    - max
    - stddev
    - var_samp
    - percentile_cont
    - percentile_disc
    - bool_or
    - bool_and
    # window
    - rank
    - dense_rank
    - row_number
    - lag
    - lead
    - first_value
    - last_value
    # numeric
    - round
    - abs
    - floor
    - ceil
    - greatest
    - least
    # null handling and types
    - coalesce
    - nullif
    - cast
    # time
    - date_trunc
    - extract
    - date
    - to_char
    - age
    # text
    - lower
    - upper
    - length
    - trim
    - substring

groundedness:
  # Tier 1-3 are code. Tier 4 is an LLM call that only fires when
  # a lower tier flags something, so most turns never pay for it.
  require_citation_ids_resolve: true
  require_numbers_trace_to_evidence: true
  numeric_tolerance_pct: 1.0
  # Block causal language on claims whose only support is an
  # empty or below-threshold retrieval result.
  block_causal_language_without_support: true
  causal_markers: ["because", "due to", "caused by", "the cause is", "results from"]
  # A sentence naming a gap is the honest partial answer, not a causal
  # claim: "cannot be established because no document covers it" must
  # not be flagged for its "because".
  causal_exempt_markers: ["cannot", "can't", "could not", "unable", "not established",
                          "no documentation", "no evidence", "not confirmed", "unknown",
                          "insufficient"]
  # Integers below this are counts and ordinals ("3 laps"), not
  # measurements; checking them is noise.
  ignore_integers_below: 10
  escalate_to_llm_on_flag: true

evaluation:
  judge_temperature: 0.0
  judge_position_swap: true       # run both orderings, require agreement
  compare_against_reference: true # kills verbosity bias
  # Overlap ceiling between a synthetic question and its target
  # chunk. Above this the question is testing string matching,
  # not retrieval.
  max_question_chunk_overlap: 0.6

observability:
  # Successes sent to Langfuse. Start at 1.0 (trace everything); lower
  # it at volume. Failures are ALWAYS sent, whatever this says.
  success_sample_rate: 1.0
  # A turn counts as a failure — always kept — when it ends like this,
  # or is partial, ungrounded, or had a node fall back after an error.
  failure_stop_reasons: [cap_reached, timeout, no_new_evidence]
  # Longest string kept in any trace field. Summaries, not payloads.
  max_field_chars: 2000

feedback:
  # A user rephrasing within this window counts as an implicit
  # negative. There are far more of these than explicit
  # thumbs-down.
  implicit_negative_window_seconds: 30
  cluster_min_size: 3
