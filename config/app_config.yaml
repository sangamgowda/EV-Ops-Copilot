# ─────────────────────────────────────────────────────────────
# Runtime knobs.
#
# Every threshold lives here rather than inline in code or
# prompts, so tuning against the golden set is a config change.
# ─────────────────────────────────────────────────────────────

agent:
  # Hard ceiling on loop iterations. The agent usually stops
  # earlier because Reflect says it has enough; this only exists
  # so a pathological question cannot spin.
  max_iterations: 3

  # Stop immediately if a lap added no new evidence. Without this
  # the agent can burn its remaining laps re-asking a question
  # that returns nothing.
  stop_if_no_new_evidence: true

  # Router complexity_hint values that skip Reflect on lap 1.
  # A pure lookup has nothing to reflect about — the answer is
  # either in the row or it isn't.
  skip_reflect_on: ["lookup"]

  # Cap on evidence entries carried in context. Entries are
  # summaries, not raw rows, so this is generous in practice.
  max_evidence_entries: 20

llm:
  # Which tier each node runs on. Router and Reflect are
  # classification under a fixed schema — they do not need the
  # strong model, and on a free tier the cheap model has a far
  # larger daily budget.
  tiers:
    router: cheap
    plan: strong
    reflect: cheap
    synthesize: strong
    judge: strong        # evaluation only, never the live path

  temperature:
    router: 0.0
    plan: 0.0
    reflect: 0.0
    synthesize: 0.2      # a little warmth in prose, nothing more
    judge: 0.0           # determinism matters more than style here

  max_tokens:
    router: 512
    plan: 1024
    reflect: 512
    synthesize: 2048
    judge: 1024

retrieval:
  # Hybrid search pulls this many candidates before reranking.
  # Candidate retrieval is cheap; reranking is what scales with
  # list length, so pull wide and rerank narrow.
  candidate_k: 50
  final_k: 5

  # Weighting between the vector and keyword halves of hybrid
  # search, fused with reciprocal rank fusion.
  rrf_k: 60
  vector_weight: 0.6
  keyword_weight: 0.4

  # Below this rerank score, a chunk is not treated as usable
  # evidence. Returning weak context is worse than returning
  # none, because weak context is what the model builds
  # confident nonsense on.
  confidence_threshold: 0.55

  # Skip reranking when the top hybrid hit leads the runner-up by
  # this margin. Common on precise entity queries.
  rerank_skip_margin: 0.25

  # Entity id is a ranking boost, not a hard filter. Most service
  # documentation is model-specific, not VIN-specific, so a strict
  # VIN filter would discard exactly the documents we want.
  entity_boost: 0.15

entity_resolution:
  # Below exact match, how close a fuzzy match must be before we
  # accept it and say so in the answer.
  auto_accept_score: 92
  # Between these, we ask the user which one they meant.
  disambiguate_score: 78
  max_suggestions: 3

chunking:
  prose_chunk_size: 800
  prose_overlap: 120
  # Tables are never split regardless of size. A shredded table
  # answers nothing.
  table_split: false
  # Lookup tables also emit one chunk per row so exact codes land
  # on a small precise chunk.
  emit_row_chunks_for_lookup_tables: true
  prepend_context_header: true

db:
  owner_pool_size: 5
  owner_max_overflow: 5
  # Small on purpose: the agent must never be able to exhaust
  # connections the rest of the system needs.
  readonly_pool_size: 3
  readonly_max_overflow: 0

sql_validation:
  max_joins: 3
  max_subquery_depth: 2
  default_limit: 100
  max_limit: 1000

  # Planner cost ceiling, checked via EXPLAIN before execution.
  # This is the check that actually protects the database — AST
  # rules cannot reason about how expensive a valid query is.
  explain_cost_budget: 500000
  explain_max_rows: 1000000

  statement_timeout_ms: 5000

  # Tables that must carry a time predicate. These are the big
  # ones; an unbounded scan here is the realistic way to hurt a
  # production database with a perfectly valid SELECT.
  require_time_filter_on:
    - vehicle_telemetry

  allowed_functions:
    - avg
    - sum
    - count
    - min
    - max
    - round
    - abs
    - coalesce
    - date_trunc
    - extract
    - now
    - percentile_cont
    - stddev

groundedness:
  # Tier 1-3 are code. Tier 4 is an LLM call that only fires when
  # a lower tier flags something, so most turns never pay for it.
  require_citation_ids_resolve: true
  require_numbers_trace_to_evidence: true
  numeric_tolerance_pct: 1.0
  # Block causal language on claims whose only support is an
  # empty or below-threshold retrieval result.
  block_causal_language_without_support: true
  causal_markers: ["because", "due to", "caused by", "the cause is", "results from"]
  escalate_to_llm_on_flag: true

evaluation:
  judge_temperature: 0.0
  judge_position_swap: true       # run both orderings, require agreement
  compare_against_reference: true # kills verbosity bias
  # Overlap ceiling between a synthetic question and its target
  # chunk. Above this the question is testing string matching,
  # not retrieval.
  max_question_chunk_overlap: 0.6

feedback:
  # A user rephrasing within this window counts as an implicit
  # negative. There are far more of these than explicit
  # thumbs-down.
  implicit_negative_window_seconds: 30
  cluster_min_size: 3
