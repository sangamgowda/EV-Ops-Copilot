# ─────────────────────────────────────────────────────────────
# Reference catalogue for the synthetic dataset.
#
# One scooter family, three models. Figures marked `public` come
# from the maker's own published articles on its two scooters,
# with product and brand names replaced by neutral ones:
#   "Volt 1"        the smaller-battery model
#   "Volt 1 Gen 2"  the flagship
#   "Volt 1 Ultra"  invented: a top-of-range model, for contrast
#
# Figures marked `assumed` were not published and are reasonable
# engineering estimates. scripts/seed_synthetic_data.py reads this
# file; change a number here and re-seed to change the data.
# ─────────────────────────────────────────────────────────────

currency: INR
market: India

# Six ride modes, lowest power to highest. Each model offers the
# modes up to its own top speed: Sonic X exists only on the Ultra.
# speed_cap is the most the controller allows in that mode; torque
# is the peak the controller allows the motor to deliver.
ride_modes:
  Eco X:   {speed_cap_kmph: 45,  torque_nm: 25, character: "very low torque, maximum range"}
  Eco:     {speed_cap_kmph: 50,  torque_nm: 35, character: "low torque, a little livelier than Eco X"}
  Ride:    {speed_cap_kmph: 70,  torque_nm: 50, character: "everyday mode, good torque"}
  Air:     {speed_cap_kmph: 90,  torque_nm: 60, character: "high speed, strong pull"}
  Sonic:   {speed_cap_kmph: 100, torque_nm: 72, character: "full performance"}
  Sonic X: {speed_cap_kmph: 115, torque_nm: 80, character: "Ultra only; unlocks the top speed"}

# Shared by every model (public unless marked).
common:
  boot_litres: 30                # public
  display: 7-inch TFT touchscreen with navigation and Bluetooth   # public
  water_resistance: IP67 battery and motor                        # public
  brakes: front and rear disc with combined braking (CBS)         # public
  suspension: telescopic front fork, rear mono-shock              # public
  standard_charger_w: 750        # public (sold as an accessory for Rs 13,000)
  charge_0_80_fixed_pack: "3 h 47 min"      # public
  charge_0_80_removable_pack: "2 h 7 min"   # public
  warranty_vehicle: "3 years or 30,000 km (vehicle, motor, battery)"  # public
  warranty_charger: "1 year or 10,000 km"   # public
  running_cost_inr_per_km: 0.25  # public
  rated_payload_kg: 150          # assumed: rider + pillion + cargo
  tyres: 12-inch tubeless        # assumed

models:

  Volt 1:
    status: on_sale
    fleet_share: 0.30            # assumed, share of seeded vehicles
    battery_kwh: 3.7             # public
    idc_range_km: 155            # public
    top_speed_kmph: 100          # set by the ride-mode table (Sonic)
    motor_peak_kw: 8.5           # assumed (same motor family)
    peak_torque_nm: 72           # assumed
    accel_0_40_s: 2.55           # public
    kerb_weight_kg: 126          # assumed
    price_inr: 124999            # assumed
    pack_nominal_v: 48.0         # assumed
    modes: [Eco X, Eco, Ride, Air, Sonic]
    wh_per_km:      {Eco X: 18, Eco: 20, Ride: 24, Air: 29, Sonic: 34}   # assumed
    avg_speed_kmph: {Eco X: 32, Eco: 36, Ride: 46, Air: 55, Sonic: 62}  # assumed
    sold_from: "2024-10-01"

  Volt 1 Gen 2:
    status: on_sale
    fleet_share: 0.45
    battery_kwh: 5.0             # public (fixed + removable pack)
    idc_range_km: 212            # public
    top_speed_kmph: 100          # set by the ride-mode table (Sonic)
    motor_peak_kw: 8.5           # public
    motor_continuous_kw: 4.5     # public
    peak_torque_nm: 72           # public
    accel_0_40_s: 2.77           # public
    kerb_weight_kg: 134          # assumed
    price_inr: 145000            # public, ex-showroom
    pack_nominal_v: 51.8         # assumed
    modes: [Eco X, Eco, Ride, Air, Sonic]
    wh_per_km:      {Eco X: 19, Eco: 21, Ride: 26, Air: 31, Sonic: 36}
    avg_speed_kmph: {Eco X: 32, Eco: 36, Ride: 46, Air: 55, Sonic: 62}
    sold_from: "2025-06-01"

  Volt 1 Ultra:
    status: on_sale
    fleet_share: 0.25
    battery_kwh: 6.4             # assumed
    idc_range_km: 248            # assumed
    top_speed_kmph: 115          # Sonic X
    motor_peak_kw: 10.5          # assumed
    peak_torque_nm: 80           # assumed
    accel_0_40_s: 2.4            # assumed
    kerb_weight_kg: 139          # assumed
    price_inr: 174999            # assumed
    pack_nominal_v: 51.8         # assumed
    modes: [Eco X, Eco, Ride, Air, Sonic, Sonic X]
    wh_per_km:      {Eco X: 19, Eco: 21, Ride: 26, Air: 31, Sonic: 36, Sonic X: 42}
    avg_speed_kmph: {Eco X: 32, Eco: 36, Ride: 46, Air: 55, Sonic: 62, Sonic X: 70}
    # Launched in the south first; other regions from launched_elsewhere.
    sold_from: "2026-06-01"
    launched_elsewhere: "2026-08-15"

# Monthly retail volumes for the whole brand. The seed script shapes
# sales_transactions to follow this curve.
monthly_sales:
  curve:
    "2024-10": 280
    "2024-11": 300
    "2024-12": 320
    "2025-01": 350
    "2025-02": 370
    "2025-03": 410
    "2025-04": 420
    "2025-05": 440
    "2025-06": 460
    "2025-07": 480
    "2025-08": 506
    "2025-09": 820
    "2025-10": 1050
    "2025-11": 1000
    "2025-12": 960
    "2026-01": 1150
    "2026-02": 1350
    "2026-03": 1760
    "2026-04": 1244
    "2026-05": 1180
    "2026-06": 1310
    "2026-07": 1420
    "2026-08": 1480
    "2026-09": 1100              # month to date

# Sales zones. Home market is the south; the others are newer.
regions:
  south: {share: 0.60, cities: [Bengaluru, Chennai, Hyderabad, Kochi, Mysuru, Coimbatore], ambient_c: 27}
  west:  {share: 0.20, cities: [Pune, Mumbai, Goa], ambient_c: 29}
  north: {share: 0.13, cities: [Delhi, Jaipur], ambient_c: 33}
  east:  {share: 0.07, cities: [Kolkata, Bhubaneswar], ambient_c: 30}

# Issues owners report for scooters in this segment. Used as the
# free-text vocabulary for service_events.reported_issue.
reported_issues:
  - {issue: "Real-world range well below claimed range", share: 0.26}
  - {issue: "Front brake feels weak; pads wearing quickly", share: 0.14}
  - {issue: "Noise from front fork over bumps", share: 0.10}
  - {issue: "Ride mode only changes after stopping and restarting", share: 0.10}
  - {issue: "Start switch intermittently unresponsive", share: 0.08}
  - {issue: "Charging slower than expected", share: 0.10}
  - {issue: "Dashboard freezes or reboots", share: 0.10}
  - {issue: "Rattle from body panels", share: 0.07}
  - {issue: "Removable battery hard to lock into its dock", share: 0.05}
