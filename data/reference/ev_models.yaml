# ─────────────────────────────────────────────────────────────
# Reference catalogue for the synthetic dataset.
#
# One fictional scooter family, three models. Each has a `role`;
# scripts/seed_synthetic_data.py refers to models only by role and to
# ride modes only by their order below, so every name lives in this
# file alone and a rename touches nothing else in the generator.
#
# Figures are representative of electric scooters sold in India;
# consumption and speed profiles are engineering estimates.
# scripts/seed_synthetic_data.py reads this file; change a number
# here and re-seed to change the data.
# ─────────────────────────────────────────────────────────────

currency: INR
market: India

# Six ride modes, lowest power to highest; the order matters. Each
# model offers the modes up to its own top speed: the last mode exists
# only on the top model. speed_cap is the most the controller allows in
# that mode; torque is the peak the controller allows the motor to
# deliver; motor_temp_c is the typical motor temperature in the mode.
ride_modes:
  Saver:  {speed_cap_kmph: 45,  torque_nm: 25, motor_temp_c: 40, character: "very low torque, maximum range"}
  Eco:    {speed_cap_kmph: 50,  torque_nm: 35, motor_temp_c: 42, character: "low torque, a little livelier than Saver"}
  Normal: {speed_cap_kmph: 70,  torque_nm: 50, motor_temp_c: 48, character: "everyday mode, good torque"}
  Sport:  {speed_cap_kmph: 90,  torque_nm: 60, motor_temp_c: 54, character: "high speed, strong pull"}
  Sport+: {speed_cap_kmph: 100, torque_nm: 72, motor_temp_c: 60, character: "full performance"}
  Ultra:  {speed_cap_kmph: 115, torque_nm: 80, motor_temp_c: 66, character: "top model only; unlocks the top speed"}

# Shared by every model.
common:
  boot_litres: 30
  display: 7-inch TFT touchscreen with navigation and Bluetooth
  water_resistance: IP67 battery and motor
  brakes: front and rear disc with combined braking (CBS)
  suspension: telescopic front fork, rear mono-shock
  standard_charger_w: 750        # sold as an accessory for Rs 13,000
  charge_0_80_fixed_pack: "3 h 47 min"
  charge_0_80_removable_pack: "2 h 7 min"
  warranty_vehicle: "3 years or 30,000 km (vehicle, motor, battery)"
  warranty_charger: "1 year or 10,000 km"
  running_cost_inr_per_km: 0.25
  rated_payload_kg: 150          # rider + pillion + cargo
  tyres: 12-inch tubeless

# role: entry | flagship | top. Scenarios and the sales mix pick
# models by role, never by name.
models:

  EVX Standard:
    role: entry
    status: on_sale
    fleet_share: 0.30            # share of seeded vehicles
    battery_kwh: 3.5
    idc_range_km: 150
    top_speed_kmph: 100          # set by the ride-mode table (Sport+)
    motor_peak_kw: 8.5           # same motor family
    peak_torque_nm: 72
    accel_0_40_s: 2.55
    kerb_weight_kg: 126
    price_inr: 120000
    pack_nominal_v: 48.0
    modes: [Saver, Eco, Normal, Sport, Sport+]
    wh_per_km:      {Saver: 18, Eco: 20, Normal: 24, Sport: 29, Sport+: 34}
    avg_speed_kmph: {Saver: 32, Eco: 36, Normal: 46, Sport: 55, Sport+: 62}
    sold_from: "2024-10-01"

  EVX Pro:
    role: flagship
    status: on_sale
    fleet_share: 0.45
    battery_kwh: 4.8             # fixed + removable pack
    idc_range_km: 200
    top_speed_kmph: 100          # set by the ride-mode table (Sport+)
    motor_peak_kw: 8.5
    motor_continuous_kw: 4.5
    peak_torque_nm: 72
    accel_0_40_s: 2.77
    kerb_weight_kg: 134
    price_inr: 140000            # ex-showroom
    pack_nominal_v: 51.8
    modes: [Saver, Eco, Normal, Sport, Sport+]
    wh_per_km:      {Saver: 19, Eco: 21, Normal: 26, Sport: 31, Sport+: 36}
    avg_speed_kmph: {Saver: 32, Eco: 36, Normal: 46, Sport: 55, Sport+: 62}
    sold_from: "2025-06-01"

  EVX Max:
    role: top
    status: on_sale
    fleet_share: 0.25
    battery_kwh: 6.0
    idc_range_km: 240
    top_speed_kmph: 115          # Ultra mode
    motor_peak_kw: 10.5
    peak_torque_nm: 80
    accel_0_40_s: 2.4
    kerb_weight_kg: 139
    price_inr: 170000
    pack_nominal_v: 51.8
    modes: [Saver, Eco, Normal, Sport, Sport+, Ultra]
    wh_per_km:      {Saver: 19, Eco: 21, Normal: 26, Sport: 31, Sport+: 36, Ultra: 42}
    avg_speed_kmph: {Saver: 32, Eco: 36, Normal: 46, Sport: 55, Sport+: 62, Ultra: 70}
    # Launched in the south first; other regions from launched_elsewhere.
    sold_from: "2026-06-01"
    launched_elsewhere: "2026-08-15"

# Monthly retail volumes across all models. The seed script shapes
# sales_transactions to follow this curve.
monthly_sales:
  curve:
    "2024-10": 280
    "2024-11": 300
    "2024-12": 320
    "2025-01": 350
    "2025-02": 370
    "2025-03": 410
    "2025-04": 420
    "2025-05": 440
    "2025-06": 460
    "2025-07": 480
    "2025-08": 506
    "2025-09": 820
    "2025-10": 1050
    "2025-11": 1000
    "2025-12": 960
    "2026-01": 1150
    "2026-02": 1350
    "2026-03": 1760
    "2026-04": 1244
    "2026-05": 1180
    "2026-06": 1310
    "2026-07": 1420
    "2026-08": 1480
    "2026-09": 1100              # month to date

# Sales zones. Home market is the south; the others are newer.
regions:
  south: {share: 0.60, cities: [Bengaluru, Chennai, Hyderabad, Kochi, Mysuru, Coimbatore], ambient_c: 27}
  west:  {share: 0.20, cities: [Pune, Mumbai, Goa], ambient_c: 29}
  north: {share: 0.13, cities: [Delhi, Jaipur], ambient_c: 33}
  east:  {share: 0.07, cities: [Kolkata, Bhubaneswar], ambient_c: 30}

# Issues owners report for scooters in this segment. Used as the
# free-text vocabulary for service_events.reported_issue.
reported_issues:
  - {issue: "Real-world range well below claimed range", share: 0.26}
  - {issue: "Front brake feels weak; pads wearing quickly", share: 0.14}
  - {issue: "Noise from front fork over bumps", share: 0.10}
  - {issue: "Ride mode only changes after stopping and restarting", share: 0.10}
  - {issue: "Start switch intermittently unresponsive", share: 0.08}
  - {issue: "Charging slower than expected", share: 0.10}
  - {issue: "Dashboard freezes or reboots", share: 0.10}
  - {issue: "Rattle from body panels", share: 0.07}
  - {issue: "Removable battery hard to lock into its dock", share: 0.05}
