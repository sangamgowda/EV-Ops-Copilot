services:
  postgres:
    # pgvector + TimescaleDB (docker/postgres.Dockerfile).
    build:
      context: docker
      dockerfile: postgres.Dockerfile
    image: opscopilot-postgres:pg16-timescale
    container_name: opscopilot-postgres
    # TimescaleDB must be preloaded; its usage telemetry stays off.
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb", "-c", "timescaledb.telemetry_level=off"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opscopilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-opscopilot}
    ports:
      # Host side is 5433, not 5432: a PostgreSQL installed directly on
      # the host commonly owns 5432, and host tools would silently reach
      # that one instead. Containers still use postgres:5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opscopilot} -d ${POSTGRES_DB:-opscopilot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Versioned migrations (Alembic), run to completion before anything
  # that reads the database starts. Every start applies only revisions
  # the database has not seen, then syncs the read-only password and the
  # data-quality ranges. It sets the read-only role's password; the API
  # container is never given it.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opscopilot-migrate
    command: ["python", "-m", "ops_copilot.db.migrate", "upgrade"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      DB_READONLY_PASSWORD: ${DB_READONLY_PASSWORD:?set DB_READONLY_PASSWORD in .env}
    healthcheck:
      disable: true          # the image's check probes the API port
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opscopilot-api
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      MCP_SERVER_HOST: mcp-server
      # The agent reaches the database only through the MCP server.
      # Blanking the read-only credentials here makes that structural:
      # a prompt-injected agent has no connection string to misuse.
      # (The owner URL stays: the API writes its own records and runs
      # ingestion, and no agent code is given an owner engine.)
      MCP_TRANSPORT: http
      DATABASE_URL_READONLY: ""
      DB_READONLY_PASSWORD: ""
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mcp-server:
        condition: service_started
    volumes:
      # Persist the HuggingFace model cache so bge-small and
      # bge-reranker-base download once, not on every rebuild.
      - hfcache:/app/.cache/huggingface
      # Reference catalogue and documents for the seed script.
      - ./data:/app/data
    restart: unless-stopped

  # MCP runs as its own service on purpose. It holds the read-only
  # database credentials; the agent's container does not. It loads
  # the embedding and reranker models at startup, so the first
  # question does not pay for them.
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opscopilot-mcp
    command: ["python", "-m", "ops_copilot.mcp_server.server", "--transport", "http"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      # Tools only read. The owner credentials have no business here.
      DATABASE_URL: ""
      POSTGRES_PASSWORD: ""
    ports:
      - "8765:8765"
    # The image's HEALTHCHECK probes the API on :8000, which this
    # service does not serve. Check that the MCP port accepts connections.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8765), 3)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - hfcache:/app/.cache/huggingface
    restart: unless-stopped

  # ── Monitoring (optional): docker compose --profile monitoring up -d ──
  # Prometheus scrapes the API's /metrics and evaluates monitoring/alerts.yml;
  # Grafana shows monitoring/grafana/dashboards. Both listen on localhost
  # only. Grafana is read-only for anonymous viewers with no login form,
  # so there is no admin password to leave at a default: dashboards are
  # changed in the JSON file, not the UI.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: opscopilot-prometheus
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: opscopilot-grafana
    profiles: ["monitoring"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/copilot.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  hfcache:
  promdata:
