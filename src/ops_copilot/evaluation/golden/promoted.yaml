# Cases promoted from real failures. Each was reviewed by a person who
# wrote what SHOULD have happened; none is a raw failure copied in.
# scripts/review_feedback.py appends here; scripts/build_golden.py
# merges these into golden.jsonl. `cluster` is the failure signature
# (feedback/signature.py) the case guards.
- id: prm_ride_mode_limits
  source: promoted
  cluster: no_signal
  tags:
  - spec
  - promoted
  - cluster:no_signal
  failure: '2026-09-24: reported average riding speeds (32, 36, 46...) as the modes'' speed limits'
  question: What ride modes does the Volt 1 Ultra have and how fast does each go?
  expected:
    facts:
    - label: Eco X
      value: 45
      tolerance: 0
    - label: Eco
      value: 50
      tolerance: 0
    - label: Ride
      value: 70
      tolerance: 0
    - label: Air
      value: 90
      tolerance: 0
    - label: Sonic
      value: 100
      tolerance: 0
    - label: Sonic X
      value: 115
      tolerance: 0
    max_iterations: 3
  reference_answer: 'Six modes: Eco X up to 45 km/h, Eco 50, Ride 70, Air 90, Sonic 100 and Sonic X 115
    (Sonic X is Ultra only).

    '
- id: prm_charger_doc_missed
  source: promoted
  cluster: empty_retrieval
  tags:
  - retrieval
  - promoted
  - cluster:empty_retrieval
  failure: '2026-09-24: charging power found, but SB-140 scored below the retrieval threshold'
  question: Why is V-064 taking so long to charge?
  expected:
    domains:
    - diagnostic
    vehicle_id: V-064
    tools:
    - structured_query_tool
    - rag_retrieval_tool
    key_args:
    - tool: structured_query_tool
      contains:
      - V-064
      - charge_power
    facts:
    - label: charge power kW
      value: 0.34
      tolerance: 0.06
    must_contain:
    - charger
    max_iterations: 3
  reference_answer: 'The charger is delivering only about 0.34 kW against a 0.75 kW baseline (about 55%
    low), so charging takes more than twice as long. Riding and battery health are normal. SB-140: test
    the charger on another scooter and replace it under warranty.

    '
- id: prm_battery_doc_missed
  source: promoted
  cluster: empty_retrieval
  tags:
  - retrieval
  - promoted
  - cluster:empty_retrieval
  failure: '2026-09-24: SB-121 scored below the retrieval threshold for ''range shorter every week'''
  question: Why is the range on V-017 getting shorter every week?
  expected:
    domains:
    - diagnostic
    vehicle_id: V-017
    tools:
    - structured_query_tool
    - rag_retrieval_tool
    must_contain:
    - - battery
      - cell health
      - degradation
      - wear
    facts:
    - label: latest cell health pct
      tolerance: 1.5
      fact_sql: 'SELECT metric_value FROM vehicle_telemetry WHERE vehicle_id = ''V-017'' AND metric_name
        = ''cell_health'' ORDER BY recorded_at DESC LIMIT 1

        '
    max_iterations: 3
  reference_answer: 'Battery wear on the removable pack: cell health has fallen steadily to about {latest
    cell health pct}% while current draw and load are normal (SB-121). Run a balance charge, then a capacity
    test if still below 85%.

    '
- id: prm_undocumented_overclaimed
  source: promoted
  cluster: no_signal
  tags:
  - abstain
  - partial
  - promoted
  - cluster:no_signal
  failure: '2026-09-24: hinted at overload after one lap without checking payload'
  question: Why is V-023 using more power than normal?
  expected:
    domains:
    - diagnostic
    vehicle_id: V-023
    tools:
    - structured_query_tool
    abstain: true
    must_not_contain:
    - due to overload
    - caused by overload
    - because of overload
    - consistent with overload
    - consistent with sustained overload
    - falls within the range reported for sustained overload
    max_iterations: 3
  reference_answer: 'Current draw is about 30% above baseline, but payload, battery health and speed are
    all normal, so overload and battery wear are ruled out. No document explains the rise; the cause cannot
    be determined from the available data.

    '
- id: prm_nonbreaking_hyphen
  source: promoted
  cluster: grounding_failure
  tags:
  - grounding
  - promoted
  - cluster:grounding_failure
  failure: '2026-09 (Phase 7): an id written with a non-breaking hyphen failed the grounding check'
  question: Why did range drop on V-029 this week?
  expected:
    domains:
    - diagnostic
    vehicle_id: V-029
    grounded: true
    must_contain:
    - - overload
      - overloaded
      - payload
    max_iterations: 3
  reference_answer: 'V-029 is overloaded: payload around 190 kg against a 150 kg rating, current draw
    roughly 36% above baseline, range estimate down about 27%, battery healthy (SB-114).

    '
