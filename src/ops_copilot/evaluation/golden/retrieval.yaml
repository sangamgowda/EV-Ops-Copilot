# Retrieval-only test set: does document search find the right
# document, and is its score above the confidence threshold? No model
# is called, so it is free to run and runs in seconds:
#
#   python scripts/eval_retrieval.py
#
# Used to choose between embedding / reranker models and to place
# retrieval.confidence_threshold, which is defined on the reranker's
# scale and must be re-derived whenever the reranker changes.
#
# positive  the expected document must be in the top results, above threshold
# negative  questions no document answers (the trap set): the best
#           score should stay BELOW the threshold
#
# The non-English questions are translations of English ones, so a
# language's hit rate can be read against the same questions in English.

positive:
  # English: the golden set's document questions
  - {lang: en, domain: diagnostic, doc: kb_range_shortfall_faq,
     q: "If a rider notices their scooter's range is still under 65% of what the spec says, what should they do next?"}
  - {lang: en, domain: diagnostic, doc: manual_ride_modes_range_and_charging,
     q: "How long does it take to charge the removable battery pack to 80 % using the standard charger?"}
  - {lang: en, domain: business, doc: sales_q2_2026_review,
     q: "How many new showrooms did the company open in the south between January and June?"}
  - {lang: en, domain: business, doc: sales_q3_2026_midquarter,
     q: "How long was the EVX Max only available in the south before it rolled out to the other regions?"}
  - {lang: en, domain: diagnostic, doc: SB-114_sustained_overload,
     q: "If a rider keeps the total weight on an EVX above 150 kg, how much higher can the average current draw get?"}
  - {lang: en, domain: diagnostic, doc: SB-121_removable_pack_cell_wear,
     q: "If my scooter's removable pack shows a cell health of 83% after a week of normal use, what steps should I take next?"}
  - {lang: en, domain: diagnostic, doc: SB-135_firmware_top_mode_speed_cap,
     q: "Why does my EVX Max scooter stop at about 45 km/h when I crank up Sport+ or Ultra after the latest OTA update?"}
  - {lang: en, domain: diagnostic, doc: SB-140_charger_low_power,
     q: "If my scooter keeps charging past midnight and the charger shows only 350 W, what's the likely cause?"}
  # English: documents the question generator never saw
  - {lang: en, domain: diagnostic, doc: SB-130_front_brake_pad_wear,
     q: "The front brake on an EVX Standard feels weak and the pads keep wearing out fast. What should the workshop do?"}
  - {lang: en, domain: business, doc: policy_fleet_discounts,
     q: "What is the largest discount a partner deal can get, and how many units does it need?"}
  - {lang: en, domain: business, doc: story_fleet_delivery_partner,
     q: "For the delivery partner that switched to electric scooters, how much did the cost per delivery fall?"}

  # Hindi
