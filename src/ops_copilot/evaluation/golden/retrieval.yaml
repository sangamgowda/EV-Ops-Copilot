  - {lang: kn, domain: diagnostic, doc: SB-130_front_brake_pad_wear,
     q: "ಮುಂಭಾಗದ ಬ್ರೇಕ್ ಪ್ಯಾಡ್‌ಗಳು ಬೇಗ ಸವೆಯುತ್ತಿವೆ, ವರ್ಕ್‌ಶಾಪ್ ಏನು ಮಾಡಬೇಕು?"}

  # Tamil
  - {lang: ta, domain: diagnostic, doc: SB-114_sustained_overload,
     q: "ஸ்கூட்டரில் 150 கிலோவுக்கு மேல் எடை இருந்தால் கரண்ட் மற்றும் ரேஞ்ச் எப்படி மாறும்?"}
  - {lang: ta, domain: diagnostic, doc: SB-135_firmware_top_mode_speed_cap,
     q: "OTA அப்டேட்டுக்குப் பிறகு Ultra மோடில் கூட 45 கிமீ வேகத்தைத் தாண்டவில்லை, ஏன்?"}
  - {lang: ta, domain: diagnostic, doc: manual_ride_modes_range_and_charging,
     q: "ஸ்டாண்டர்ட் சார்ஜரில் ரிமூவபிள் பேட்டரியை 80% வரை சார்ஜ் செய்ய எவ்வளவு நேரம் ஆகும்?"}

