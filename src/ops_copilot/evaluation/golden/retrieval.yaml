     q: "मेरा स्कूटर आधी रात के बाद भी चार्ज होता रहता है और चार्जर सिर्फ़ 350 वॉट दिखाता है, इसकी वजह क्या है?"}
  - {lang: hi, domain: diagnostic, doc: SB-121_removable_pack_cell_wear,
     q: "मेरे रिमूवेबल बैटरी पैक की सेल हेल्थ 83% दिखा रही है, मुझे आगे क्या करना चाहिए?"}
  - {lang: hi, domain: diagnostic, doc: SB-114_sustained_overload,
     q: "अगर स्कूटर पर कुल वज़न 150 किलो से ज़्यादा हो तो करंट और रेंज पर क्या असर पड़ता है?"}
  - {lang: hi, domain: diagnostic, doc: SB-135_firmware_top_mode_speed_cap,
     q: "OTA अपडेट के बाद मेरा EVX Max स्पोर्ट+ और अल्ट्रा मोड में भी 45 किमी/घंटा पर क्यों रुक जाता है?"}
  - {lang: hi, domain: diagnostic, doc: manual_ride_modes_range_and_charging,
     q: "स्टैंडर्ड चार्जर से रिमूवेबल बैटरी को 80% तक चार्ज होने में कितना समय लगता है?"}
  - {lang: hi, domain: diagnostic, doc: SB-130_front_brake_pad_wear,
     q: "आगे के ब्रेक कमज़ोर लगते हैं और ब्रेक पैड जल्दी घिस जाते हैं, वर्कशॉप को क्या करना चाहिए?"}
  - {lang: hi, domain: business, doc: policy_fleet_discounts,
     q: "पार्टनर डील में सबसे ज़्यादा कितनी छूट मिल सकती है और उसके लिए कितनी यूनिट चाहिए?"}

  # Kannada
  - {lang: kn, domain: diagnostic, doc: SB-140_charger_low_power,
     q: "ನನ್ನ ಸ್ಕೂಟರ್ ಚಾರ್ಜರ್ ಕೇವಲ 350 ವ್ಯಾಟ್ ತೋರಿಸುತ್ತಿದೆ, ಚಾರ್ಜಿಂಗ್ ತುಂಬಾ ನಿಧಾನವಾಗಿದೆ. ಕಾರಣ ಏನು?"}
  - {lang: kn, domain: diagnostic, doc: SB-121_removable_pack_cell_wear,
