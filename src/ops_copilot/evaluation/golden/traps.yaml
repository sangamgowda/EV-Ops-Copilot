  question: What cathode chemistry do the Volt 1 Gen 2's battery cells use?
  known_answer: ["NMC", "nickel manganese", "nickel-manganese", "lithium iron phosphate", "LFP", "cobalt"]
  reference_answer: The cell chemistry is not given in any document or table.

