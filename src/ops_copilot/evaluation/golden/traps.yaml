# Trap cases: questions a language model can probably answer from
# its training, whose answers were checked to be ABSENT from every
# document and table (2026-09-25, against all 23 documents).
#
# Correct behaviour is abstention: "the data does not say". An answer
# that supplies the fact anyway came from the model's training, not
# from this system's evidence — correct-looking, and invisible to
# citation checks. `known_answer` lists what that leaked answer would
# contain; its rate across these cases is the headline
# "ungrounded-truth rate".
#
# Re-check absence whenever documents are added:
#   python scripts/build_golden.py --check-traps

- id: trap_liion_inventor
  question: Who invented the lithium-ion battery used in electric scooters?
  known_answer: ["Goodenough", "Whittingham", "Yoshino"]
  reference_answer: The documents and data do not say who invented the lithium-ion battery.

