  question: What is the nominal voltage of a single lithium-ion cell?
  known_answer: ["3.6 V", "3.6V", "3.6 volts", "3.7 V", "3.7V", "3.7 volts"]
  reference_answer: The single-cell voltage is not given in the documents or data.

