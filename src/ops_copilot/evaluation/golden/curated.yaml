# Hand-written cases: adversarial ones, and ones promoted from real
# failures. scripts/build_golden.py merges these with the generated
# cases into golden.jsonl.
#
# `fact_sql` fills a fact's value from the database at build time, so
# a number is never typed by hand and never goes stale on a re-seed.
# Any fact without `value` must have `fact_sql`.

# ── adversarial ──────────────────────────────────────────────

- id: adv_nonexistent_vehicle
  source: adversarial
  tags: [nonexistent_entity, abstain]
  question: Why did range drop on V-999 this week?
  expected:
    vehicle_id: not_found
    forbidden_args: [{tool: structured_query_tool, contains: ["V-999"]}]
    abstain: true
    must_contain: [["does not exist", "doesn't exist", "no vehicle", "not found", "could not be resolved", "no such", "no record"]]
    max_iterations: 2
  reference_answer: >
    There is no vehicle V-999 in the data (the fleet is V-001 to V-120), so
    there is nothing to diagnose.

- id: adv_typo_vehicle
  source: adversarial
  tags: [entity_typo]
  question: Why did range drop on V42 this week?
  expected:
    domains: [diagnostic]
    vehicle_id: V-042
    tools: [structured_query_tool]
    must_contain: [["overload", "overloaded", "payload"]]
    max_iterations: 3
  reference_answer: >
    V42 is V-042. It is overloaded: payload around 190 kg against a 150 kg
    rating, current draw roughly 38% above baseline and range estimate about
    26% below it, with battery health normal (SB-114).

- id: adv_nonexistent_model
  source: adversarial
  tags: [nonexistent_entity, abstain]
  question: What is the top speed of the Volt 2?
  expected:
    abstain: true
    max_iterations: 2
  reference_answer: >
    There is no model called Volt 2. The family is the Volt 1 (100 km/h),
    Volt 1 Gen 2 (100 km/h) and Volt 1 Ultra (115 km/h).

- id: adv_refute_claim
  source: adversarial
  tags: [claim_to_refute]
  question: V-017's range is dropping because it's overloaded, isn't it?
  expected:
    domains: [diagnostic]
    vehicle_id: V-017
    tools: [structured_query_tool]
    must_contain: [["battery", "cell health", "cell wear", "degradation"]]
    must_not_contain: ["due to overload", "caused by overload", "because it is overloaded", "because of overload", "yes, it is overloaded"]
    max_iterations: 3
  reference_answer: >
    No. V-017's payload is normal (around 90 kg against a 150 kg rating).
    The range loss comes from battery wear: cell health has fallen to about
    84%, with current draw normal (SB-121).

- id: adv_missing_metric
  source: adversarial
  tags: [missing_evidence, abstain]
  question: What is the tyre pressure on V-042?
  expected:
    abstain: true
    must_not_contain: ["psi"]
    max_iterations: 2
  reference_answer: >
    Tyre pressure is not recorded for any vehicle, so it cannot be answered
    from the data.

- id: adv_ambiguous
  source: adversarial
  tags: [ambiguous]
  question: Why is my scooter slow?
  expected:
    max_iterations: 3
  reference_answer: >
    It depends on which scooter, so the vehicle id is needed. Common causes in
    this fleet: Eco X and Eco modes limit speed to 45 and 50 km/h; overload
    above 150 kg; and Volt 1 Ultras on firmware 3.2.0 are held to 45 km/h in
    Sonic and Sonic X (SB-135).

- id: adv_cross_domain
  source: adversarial
  tags: [cross_domain]
  question: >
    V-042 is overloaded on delivery work. How many scooters were sold through
    the fleet channel in the south between 1 July and 30 September 2026?
  expected:
    domains: [diagnostic, business]
    tools: [structured_query_tool]
    key_args: [{tool: structured_query_tool, contains: ["fleet", "south"]}]
    facts:
      - label: south fleet sales Q3 2026
        tolerance: 0
        fact_sql: >
          SELECT count(*) FROM sales_transactions WHERE channel = 'fleet'
          AND region = 'south' AND sold_on BETWEEN '2026-07-01' AND '2026-09-30'
    max_iterations: 3
  reference_answer: >
    {south fleet sales Q3 2026} scooters were sold through the fleet channel in
    the south between 1 July and 30 September 2026. (V-042's overload is
    explained by SB-114.)

- id: adv_holdout_brakes
  source: adversarial
  tags: [holdout_document]
  question: The front brake on a Volt 1 feels weak and the pads keep wearing out fast. What should the workshop do?
  expected:
    domains: [diagnostic]
    tools: [rag_retrieval_tool]
    must_contain: [["replace", "replaced", "replacing"], ["rear lever", "cbs", "combined braking", "regenerative"]]
    max_iterations: 2
  reference_answer: >
    Replace the front brake pads with the revised compound part (SB-130), and
    show the rider how the rear lever brakes both wheels through CBS; a higher
    regenerative braking level also reduces pad wear.

- id: adv_holdout_partner_discount
  source: adversarial
  tags: [holdout_document]
  question: What is the largest discount a partner deal can get, and how many units does it need?
  expected:
    domains: [business]
    tools: [rag_retrieval_tool]
    facts: [{label: max partner discount pct, value: 7, tolerance: 0}, {label: minimum units, value: 10, tolerance: 0}]
    max_iterations: 2
  reference_answer: >
    Partner deals (rental, subscription) can get up to 7% off, with a minimum
    of 10 units. Anything above needs regional sales head approval.

- id: adv_holdout_delivery_story
  source: adversarial
  tags: [holdout_document]
  question: For the delivery partner that switched to electric scooters, how much did the energy or fuel cost per delivery fall?
  expected:
    domains: [business]
    tools: [rag_retrieval_tool]
    facts: [{label: before, value: 4.10, tolerance: 0.01}, {label: after, value: 1.35, tolerance: 0.01}]
    max_iterations: 2
  reference_answer: >
    From ₹4.10 per delivery on petrol to ₹1.35 on electric.

- id: adv_launch_timing
  source: adversarial
  tags: [temporal]
  question: How many Volt 1 Ultras were sold in the west before 15 August 2026?
  expected:
    domains: [business]
    tools: [structured_query_tool]
    must_contain: [["0 ", "zero", "none", "no volt 1 ultra", "no ultra", "not sold", "not on sale", "wasn't on sale", "was not on sale"]]
    max_iterations: 3
  reference_answer: >
    None. The Ultra only went on sale outside the south on 15 August 2026.

- id: adv_longest_range
  source: adversarial
  tags: [comparison]
  question: Which scooter model has the longest certified range, and what is it?
  expected:
    must_contain: ["Ultra"]
    facts: [{label: ultra range km, value: 248, tolerance: 0}]
    max_iterations: 2
  reference_answer: The Volt 1 Ultra, with 248 km.

- id: adv_mode_not_available
  source: adversarial
  tags: [claim_to_refute]
  question: Can I use Sonic X mode on a Volt 1 Gen 2?
  expected:
    must_contain: ["Ultra"]
    max_iterations: 2
  reference_answer: >
    No. Sonic X (up to 115 km/h) is only on the Volt 1 Ultra. The Volt 1
    Gen 2 tops out at Sonic, 100 km/h.

- id: adv_south_outperformed
  source: adversarial
  tags: [business, explain]
  note: the generated question for sales_q3_2026_midquarter was rejected three times for word overlap
  question: Why did the south outsell the other regions between July and September 2026?
  expected:
    must_contain: ["Ultra", ["launch", "launched", "went on sale", "on sale"]]
    facts:
      - label: south sales Q3 2026
        tolerance: 0
        fact_sql: >
          SELECT count(*) FROM sales_transactions WHERE region = 'south'
          AND sold_on BETWEEN '2026-07-01' AND '2026-09-30'
    max_iterations: 3
  reference_answer: >
    The Volt 1 Ultra launched in the south on 1 June 2026, ten weeks before the
    other regions got it (15 August). South sales reached {south sales Q3 2026}
    in July to September while the other regions stayed roughly flat; Ultra
    sales added to, rather than replaced, the other models.

# Promoted cases live in promoted.yaml.
